<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap');
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Inter";
      background-color: hsl(0, 0%, 8%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main {
      width: fit-content;
      background-color: hsl(0, 0%, 12%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      border-style: clear;
    }
    .avatar {
      width: 35%;
      border-radius: 50%;
    }
    h1 {
      color: white;
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    h2 {
      color: hsl(75, 94%, 57%);
      font-size: 14px;
    }
    p {
      color: rgb(207, 207, 207);
      font-size: 14px;
      margin-top: 25px;
      margin-bottom: 30px;
    }
    ul {
      display: flex;
      flex-direction: column;
      text-align: center;
      list-style-type: none;
      justify-content: center;
      align-items: center;
    }
    li {
      color: white;
      font-size: 14px;
      font-weight: bold;
      background-color: hsl(0, 0%, 20%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 300px;
      height: 40px;
      margin-bottom: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="assets/images/avatar-jessica.jpeg" />
    <h1>Jessica Randall</h1>
    <h2>London, United Kingdom</h2>
    <p>"Front-end developer and avid reader."</p>

    <ul>
      <li>GitHub</li>
      <li>Frontend Mentor</li>
      <li>LinkedIn</li>
      <li>Twitter</li>
      <li>Instagram</li>
    </ul>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
