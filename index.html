<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap');
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Inter";
      background-color: hsl(0, 0%, 8%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main {
      width: 380px;
      height: 600px;
      background-color: hsl(0, 0%, 12%);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      border-style: clear;
    }
    .avatar {
      width: 35%;
      border-radius: 50%;
    }
    h1 {
      color: white;
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    h2 {
      color: hsl(75, 94%, 57%);
      font-size: 14px;
    }
    p {
      color: rgb(207, 207, 207);
      font-size: 14px;
      margin-top: 25px;
      margin-bottom: 30px;
    }
    ul {
      display: flex;
      flex-direction: column;
      text-align: center;
      list-style-type: none;
      justify-content: center;
      align-items: center;
    }
    li {
      color: white;
      font-size: 14px;
      font-weight: bold;
      background-color: hsl(0, 0%, 20%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 300px;
      height: 40px;
      margin-top: 7.5px;
      margin-bottom: 7.5px;
      border-radius: 10px;
    }
    a {
      color: white;
      text-decoration: none;
    }
    a:hover {
      color: hsl(75, 94%, 57%);
    }
    a:active {
      color: red;
    }
    .attribution {
      color: white;
      position: absolute;
      bottom: 0;
      padding-bottom: 10px;
    }
    .attribution a {
      color: hsl(75, 94%, 57%);
    }

    /* MEDIA QUERIES FOR BREAKPOINTS */
    @media (max-width: 1200px) {
      .container {
        max-width: 360px;
        max-height: 590px;
      }
      li {
        max-width: 95%;
      }
      h1 {
        font-size: 1.3rem;
      }
      h2 {
        font-size: .75rem;
      }
      p {
        font-size: .75rem;
      }
      a {
        font-size: .8rem;
      }
    }
    @media (max-width: 992px) {
      .container {
        max-width: 340px;
        max-height: 580px;
      }
      li {
        max-width: 90%;
      }
      h1 {
        font-size: 1.2rem;
      }
      h2 {
        font-size: .70rem;
      }
      p {
        font-size: .70rem;
      }
      a {
        font-size: .75rem;
      }
    }
    @media (max-width: 768px) {
      .container {
        max-width: 320px;
        max-height: 570px;
      }
      li {
        max-width: 85%;
      }
      h1 {
        font-size: 1.1rem;
      }
      h2 {
        font-size: .65rem;
      }
      p {
        font-size: .65rem;
      }
      a {
        font-size: .7rem;
      }
    }
    @media (max-width: 600px) {
      .container {
        max-width: 300px;
        max-height: 560px;
      }
      li {
        max-width: 80%;
      }
      h1 {
        font-size: 1.0rem;
      }
      h2 {
        font-size: .6rem;
      }
      a {
        font-size: .65rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="avatar" src="assets/images/avatar-jessica.jpeg" alt="A faceshot of an individual" />
    <h1>Jessica Randall</h1>
    <h2>London, United Kingdom</h2>
    <p>"Front-end developer and avid reader."</p>

    <ul>
      <li><a href="https://github.com/" target="_blank">GitHub</a></li>
      <li><a href="https://www.frontendmentor.io" target="_blank">Frontend Mentor</a></li>
      <li><a href="https://www.linkedin.com/" target="_blank">LinkedIn</a></li>
      <li><a href="https://x.com/" target="_blank">Twitter</a></li>
      <li><a href="https://www.instagram.com/" target="_blank">Instagram</a></li>
    </ul>
  </main>
  
  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/JoshuaM04" target="_blank">Joshua Martinez</a>.
    </p>
  </footer>
</body>
</html>
